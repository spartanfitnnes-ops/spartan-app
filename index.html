<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ventas - Spartan Fitness</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;
        }
        button:hover { background-color: #218838; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registrar Nueva Venta</h2>
    <form id="formularioVentas">
        <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="datetime-local" id="fecha" required>
        </div>
        
        <div class="form-group">
            <label for="producto">Producto:</label>
            <input type="text" id="producto" placeholder="Ej. Chaqueta doble prenda" required>
        </div>

        <div class="form-group">
            <label for="costo">Costo ($):</label>
            <input type="number" id="costo" placeholder="Ej. 95000" required>
        </div>

        <div class="form-group">
            <label for="precio_venta">Precio Venta ($):</label>
            <input type="number" id="precio_venta" placeholder="Ej. 175000" required>
        </div>

        <!-- AQUÍ ESTÁ EL CAMPO CLAVE DEL BANCO -->
        <div class="form-group">
            <label for="cuenta_destino">Cuenta Destino (Banco):</label>
            <select id="cuenta_destino" required>
                <option value="" disabled selected>Seleccione el banco...</option>
                <option value="Bancolombia">Bancolombia</option>
                <option value="Nequi">Nequi</option>
                <option value="Davivienda">Davivienda</option>
                <option value="Daviplata">Daviplata</option>
                <option value="Efectivo">Efectivo</option>
                <!-- Agrega aquí más bancos si los necesitas -->
            </select>
        </div>

        <button type="submit">Guardar Venta</button>
    </form>
    <div id="mensaje"></div>
</div>

<script>
    // ⚠️ ATENCIÓN: PEGA AQUÍ TU URL DE APPS SCRIPT
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOj9PiDx8EOpjfcQzYDPRjKoteZ7J2H5maxYy5mOZO6theRq_oh5SIqO7gGcUCxLc/exec'; 

    document.getElementById('formularioVentas').addEventListener('submit', function(event) {
        event.preventDefault(); // Evitar que la página se recargue

        // Mostrar mensaje de carga
        const divMensaje = document.getElementById('mensaje');
        divMensaje.style.color = '#0056b3';
        divMensaje.textContent = 'Guardando datos...';

        // Capturar datos del formulario
        const fecha = document.getElementById('fecha').value;
        const producto = document.getElementById('producto').value;
        const costo = document.getElementById('costo').value;
        const precio_venta = document.getElementById('precio_venta').value;
        const cuenta_destino = document.getElementById('cuenta_destino').value;

        // Preparar el paquete de datos para enviar
        const formData = new FormData();
        // NOTA: Los nombres entre comillas ('Fecha', 'Producto') deben coincidir con e.parameter en el Apps Script
        formData.append('Fecha', fecha);
        formData.append('Producto', producto);
        formData.append('Costo', costo);
        formData.append('Precio_Venta', precio_venta);
        formData.append('Cuenta_Destino', cuenta_destino);

        // Enviar la petición al servidor (Google Apps Script)
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(data => {
            if(data === "Éxito") {
                divMensaje.style.color = 'green';
                divMensaje.textContent = '¡Venta registrada con éxito!';
                document.getElementById('formularioVentas').reset(); // Limpiar formulario
                setTimeout(() => divMensaje.textContent = '', 4000);
            } else {
                divMensaje.style.color = 'red';
                divMensaje.textContent = 'Hubo un error: ' + data;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            divMensaje.style.color = 'red';
            divMensaje.textContent = 'Error de conexión. Inténtalo de nuevo.';
        });
    });

    // Poner fecha y hora actual por defecto al cargar la página
    window.onload = function() {
        var now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('fecha').value = now.toISOString().slice(0,16);
    };
</script>

</body>
</html>
